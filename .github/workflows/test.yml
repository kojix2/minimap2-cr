name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Crystal (non-Windows)
        if: runner.os != 'Windows'
        uses: crystal-lang/install-crystal@v1

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bzip2 \
            curl \
            pkg-config \
            zlib1g-dev

      - name: Install build toolchain + Crystal (Windows/MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-crystal
            mingw-w64-ucrt-x86_64-shards
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            tar
            git

      - name: Build minimap2 (non-Windows)
        if: runner.os != 'Windows'
        run: crystal run ext/build.cr

      - name: Build minimap2 (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MAKE: mingw32-make
        run: crystal run ext/build.cr

      - name: Install shards
        if: runner.os != 'Windows'
        run: shards install

      - name: Install shards (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: shards install

      - name: Build native comparison command (non-Windows)
        if: runner.os != 'Windows'
        run: |
          case "${{ runner.arch }}" in
            ARM64) make -C ext/minimap2 aarch64=1 minimap2 ;;
            *) make -C ext/minimap2 minimap2 ;;
          esac

      - name: Build native comparison command (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: mingw32-make -C ext/minimap2 minimap2

      - name: Run specs
        if: runner.os != 'Windows'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ext
          MINIMAP2_BIN: ./ext/minimap2/minimap2
        run: crystal spec

      - name: Build example command (non-Windows)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          crystal build examples/minimap2-cr.cr -o bin/minimap2-cr

      - name: Run specs (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MINIMAP2_BIN: ./ext/minimap2/minimap2.exe
        run: crystal spec

      - name: Build example command (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p bin
          crystal build examples/minimap2-cr.cr -o bin/minimap2-cr.exe
